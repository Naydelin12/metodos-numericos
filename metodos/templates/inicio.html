<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Métodos Numéricos</title>

    <style>

        body{
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
            padding-top: 50px;
        }

        h1{
            color: #2c3e50;
        }

        .contenedor{
            background: white;
            width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        .boton{
            display: block;
            width: 250px;
            margin: 20px auto;
            padding: 15px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 18px;
        }

        .boton:hover{
            background-color: #2980b9;
        }

    </style>

</head>

<body>

    <div class="contenedor">

        <h1>Proyecto de Métodos Numéricos</h1>

        <h2>Selecciona un método</h2>

        <a href="/newton/" class="boton">Método Newton-Raphson</a>

        <a href="/secante/" class="boton">Método Secante</a>

    </div>

</body>
</html>
